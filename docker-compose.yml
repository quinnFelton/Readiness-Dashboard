# Local Postgres for dev (prod is Aurora Serverless v2, PLAN §11).
# Credentials match DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rd
      POSTGRES_PASSWORD: rd
      POSTGRES_DB: readiness
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rd -d readiness']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
